name: Bug Report / 问题反馈
description: 报告连接失败、认证异常、系统代理或界面问题（需附脱敏日志）
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！不同学校/企业的 EasyConnect 与 aTrust 服务端行为存在差异，请务必附上从 **日志 → 导出脱敏日志** 导出的日志文件。
        导出的日志会自动脱敏用户名、密码、Token、Cookie、Session ID 等信息，提交前仍建议再快速检查一遍。

  - type: dropdown
    id: protocol
    attributes:
      label: VPN 协议 / Protocol
      options:
        - EasyConnect
        - aTrust
        - Both / N/A
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / OS
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10/11
        - Linux (GNOME)
        - Linux (KDE / Hyprland / Other)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: InfiConnect 版本 / App Version
      placeholder: 例如 0.1.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤 / Description & Steps to Reproduce
      placeholder: |
        1. 创建或导入档案...
        2. 点击连接...
        3. 出现什么错误或不符合预期的行为...
    validations:
      required: true

  - type: textarea
    id: sanitized_logs
    attributes:
      label: 脱敏日志 / Sanitized Diagnostic Logs (必需)
      description: 请点击应用内「日志 → 导出脱敏日志」，将内容粘贴到下方或直接拖拽上传日志文件。
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已确认日志已经过脱敏，不含个人密码、Token 或隐私信息。
          required: true
        - label: 我已确认该服务端使用原生 ZJU-Connect 或官方客户端可以正常连接。
          required: false
