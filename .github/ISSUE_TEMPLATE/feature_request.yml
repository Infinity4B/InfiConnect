name: Feature Request / 功能建议
description: 提出新功能、服务端兼容性改进或体验优化建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Problem Statement
      description: 描述你遇到的问题或希望解决的痛点。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 你期望 InfiConnect 如何实现这项功能？
    validations:
      required: true
