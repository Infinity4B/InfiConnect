name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CGO_ENABLED: "0"

jobs:
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync mygo.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          jq --arg v "$TAG_VER" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
          echo "Building version: $(jq -r .version mygo.json)"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build macOS bundles & DMGs (arm64, amd64, universal)
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64,darwin/universal

      - name: Collect macOS release assets
        shell: bash
        run: |
          VERSION="$(jq -r .version mygo.json)"
          mkdir -p release-assets
          for arch in arm64 amd64 universal; do
            dir="build/darwin-$arch"
            cp "$dir"/*.dmg "release-assets/InfiConnect-${VERSION}-macOS-${arch}.dmg"
            ditto -c -k --keepParent "$dir/InfiConnect.app" "release-assets/InfiConnect-${VERSION}-macOS-${arch}.zip"
          done
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    name: Build (Windows amd64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync mygo.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $cfg = Get-Content mygo.json -Raw | ConvertFrom-Json
          $cfg.version = $ver
          $cfg | ConvertTo-Json -Depth 10 | Set-Content mygo.json -Encoding UTF8
          Write-Host "Building version: $ver"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build Windows executable & NSIS installer
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          $ver = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $setup = Get-ChildItem -Path build/windows-amd64 -Filter "*setup*.exe" | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "release-assets/InfiConnect-$ver-Windows-amd64-setup.exe"
          }
          Compress-Archive -Path "build/windows-amd64/InfiConnect.exe" -DestinationPath "release-assets/InfiConnect-$ver-Windows-amd64-portable.zip" -Force
          Get-ChildItem release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Build (Linux amd64 & arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync mygo.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          jq --arg v "$TAG_VER" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
          echo "Building version: $(jq -r .version mygo.json)"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build Linux packages (amd64, arm64)
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform linux/amd64,linux/arm64

      - name: Collect Linux release assets
        shell: bash
        run: |
          mkdir -p release-assets
          for arch in amd64 arm64; do
            dir="build/linux-$arch"
            for ext in tar.gz deb rpm; do
              for f in "$dir"/*."$ext"; do
                [ -f "$f" ] && cp "$f" release-assets/
              done
            done
          done
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums & publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets
          cat > notes.md <<'EOF'
          ### 下载说明 / Downloads

          | 文件 | 适用平台 |
          |---|---|
          | `InfiConnect-*-macOS-arm64.dmg` | macOS Apple Silicon（M1 及以上） |
          | `InfiConnect-*-macOS-amd64.dmg` | macOS Intel 芯片 |
          | `InfiConnect-*-macOS-universal.dmg` | macOS 通用版（Apple Silicon + Intel） |
          | `InfiConnect-*-Windows-amd64-setup.exe` | Windows 64 位安装程序 |
          | `InfiConnect-*-Windows-amd64-portable.zip` | Windows 64 位绿色便携版 |
          | `inficonnect-*.deb` / `.rpm` / `.tar.gz` | Linux（amd64 / arm64） |

          > **macOS 提示**：应用当前采用 ad-hoc 签名，首次打开若提示无法验证开发者，请在「系统设置 → 隐私与安全性」中点击「仍要打开」，或执行：
          > ```bash
          > xattr -dr com.apple.quarantine /Applications/InfiConnect.app
          > ```
          EOF

          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "InfiConnect $GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes \
              --verify-tag \
              "${flags[@]}"
          fi
